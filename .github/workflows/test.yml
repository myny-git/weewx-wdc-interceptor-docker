name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Python syntax
        run: python3 -m compileall -q src tests
      - name: Backup failure and restore checks
        run: bash tests/test_backup.sh

  integration:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the production image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: weewx-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migration, persistence and Forecast database tests
        run: |
          docker run --rm --entrypoint python \
            --mount "type=bind,source=$PWD/tests,target=/tests,readonly" \
            weewx-test:ci -m unittest discover -s /tests -v
      - name: Container start, replacement and full backup/restore
        run: bash tests/smoke.sh weewx-test:ci
      - name: Save the tested image
        run: docker save weewx-test:ci -o /tmp/weewx-image.tar
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tested-image
          path: /tmp/weewx-image.tar
          retention-days: 3
      - name: Verify artifact transfer used by publishing
        uses: actions/download-artifact@v8.0.2
        with:
          name: tested-image
          path: /tmp/image-roundtrip
      - name: Check downloaded image matches the tested image
        run: cmp /tmp/weewx-image.tar /tmp/image-roundtrip/weewx-image.tar
