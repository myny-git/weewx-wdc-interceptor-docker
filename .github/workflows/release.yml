name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New GitHub release tag (e.g. 5.5.2)'
        required: true
        default: '5.5.2'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  release:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          version=$(sed -n 's/^ARG WEEWX_VERSION="\([^"]*\)"/\1/p' Dockerfile)
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9_.-]+)?$ ]]
          [[ "$RELEASE_TAG" == "$version" || "$RELEASE_TAG" == "$version"-* ]]
          gh release create "$RELEASE_TAG" --target "$TESTED_SHA" \
            --title "Release $RELEASE_TAG" --notes-file RELEASE_NOTES.md
