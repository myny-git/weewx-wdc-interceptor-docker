name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New Docker Hub tag (must match the WeeWX version, e.g. 5.5.2)'
        required: true
        default: '5.5.2'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  publish:
    runs-on: ubuntu-latest
    needs: verify
    concurrency:
      group: publish-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: /tmp/image
      - name: Validate tag and load tested image
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^ARG WEEWX_VERSION="\([^"]*\)"/\1/p' Dockerfile)
          [[ "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9_.-]+)?$ ]]
          [[ "$IMAGE_TAG" == "$version" || "$IMAGE_TAG" == "$version"-* ]]
          docker load -i /tmp/image/weewx-image.tar
          docker tag weewx-test:ci "mynygit/weewxv5_docker:$IMAGE_TAG"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Publish the exact tested image
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: docker push "mynygit/weewxv5_docker:$IMAGE_TAG"
